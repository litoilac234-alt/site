# Render Blueprint — PEO Monitoring (Docker + external MySQL)
# Docs: DEPLOY-RENDER.md
#
# MySQL is NOT included on Render free tier. Create TiDB Serverless first,
# then set MYSQL* variables in the Render dashboard (or uncomment env vars below).

services:
  - type: web
    name: peo-monitoring
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health.php
    envVars:
      - key: APP_BASE_PATH
        value: /
      - key: MYSQL_SSL
        value: "1"
      # Set these in the Render dashboard after creating TiDB (see DEPLOY-RENDER.md):
      # - key: APP_URL
      # - key: MYSQLHOST
      # - key: MYSQLPORT
      # - key: MYSQLDATABASE
      # - key: MYSQLUSER
      # - key: MYSQLPASSWORD
